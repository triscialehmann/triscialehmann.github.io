<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private — Enter Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16324f;        /* deep navy from the sky */
    --mist: #fbe3d3;       /* warm peach clouds */
    --paper: #fdf1e6;      /* cream card */
    --accent: #e8523a;     /* coral red road */
    --accent-dark: #c93f2b;
    --slate: #4a6b8a;      /* muted mountain blue */
    --error: #c93f2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: linear-gradient(160deg, #16324f 0%, #2c4d6e 100%);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 24px;
  }
  .gate {
    background: var(--paper);
    border-radius: 18px;
    padding: 56px 48px 48px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(10,25,42,.45);
    animation: rise .5s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gate { animation: none; }
  }
  .lock {
    width: 52px; height: 52px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--mist);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.65rem;
    color: var(--ink);
    margin-bottom: 8px;
  }
  p.sub {
    color: var(--slate);
    font-size: .95rem;
    margin-bottom: 28px;
  }
  .field { position: relative; margin-bottom: 14px; }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 48px 14px 16px;
    font-size: 1rem;
    font-family: inherit;
    border: 1.5px solid #e6c4ad;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    color: var(--ink);
    background: #fff9f3;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,82,58,.22);
  }
  .toggle {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    border: none; background: none;
    cursor: pointer;
    padding: 8px;
    color: var(--slate);
    font-size: .8rem;
  }
  .toggle:hover { color: var(--accent); }
  button.enter {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 500;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
  }
  button.enter:hover { background: var(--accent-dark); }
  button.enter:focus-visible,
  .toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .msg {
    min-height: 22px;
    margin-top: 14px;
    font-size: .88rem;
    color: var(--error);
  }
  .counter {
    text-align: center;
    line-height: 1.6;
    opacity: .85;
  }
  .counter img { display: block; margin: 0 auto; }
  .counter .credit {
    display: inline-block;
    margin-top: 4px;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 10px;
    color: var(--mist);
    letter-spacing: .06em;
  }
  .gate.shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    50% { transform: translateX(7px); }
    75% { transform: translateX(-4px); }
  }
</style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="lock" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2"/>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      </svg>
    </div>
    <h1>This page is private</h1>
    <p class="sub">Enter the password to continue.</p>
    <div class="field">
      <input type="password" id="pw" placeholder="Password" autocomplete="off" autofocus
             aria-label="Password" onkeydown="if(event.key==='Enter')check()">
      <button class="toggle" type="button" onclick="toggleVisibility()" id="toggleBtn" aria-label="Show password">Show</button>
    </div>
    <button class="enter" onclick="check()">Enter</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </main>

  <!-- hitwebcounter Code START -->
  <div class="counter">
    <img src="https://www.hitwebcounter.com/counter/counter.php?page=21513218&amp;style=0008&amp;nbdigits=6&amp;type=page" alt="Total Characters" decoding="async" style="border:0;max-width:100%;height:auto;" />
    <br />
    <span class="credit">PageHits</span>
  </div>
  <!-- hitwebcounter Code END -->

<script>
  const PASSWORD = "TrishLehmann26";
  const DESTINATION = "home.html";

  function check() {
    const input = document.getElementById("pw");
    const msg = document.getElementById("msg");
    const gate = document.getElementById("gate");
    if (input.value === PASSWORD) {
      msg.style.color = "#4a6b8a";
      msg.textContent = "Welcome — redirecting…";
      setTimeout(() => { window.location.href = DESTINATION; }, 600);
    } else {
      msg.style.color = "";
      msg.textContent = "Incorrect password. Please try again.";
      input.value = "";
      input.focus();
      gate.classList.remove("shake");
      void gate.offsetWidth; /* restart animation */
      gate.classList.add("shake");
    }
  }

  function toggleVisibility() {
    const input = document.getElementById("pw");
    const btn = document.getElementById("toggleBtn");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "Hide" : "Show";
    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  }
</script>
</body>
</html>
