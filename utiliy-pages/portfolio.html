<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portfolio — Pixel World</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:#0d0d1a;
  font-family:'Press Start 2P',monospace;
  overflow:hidden;
  width:100vw;height:100vh;
  touch-action:none;
  user-select:none;
}

body.desktop{cursor:none;}

#cursor{
  position:fixed;width:12px;height:12px;
  background:#ffe44d;
  clip-path:polygon(0 0,100% 0,100% 75%,75% 75%,75% 100%,50% 100%,50% 75%,0 75%);
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  display:none;
}
body.desktop #cursor{display:block;}

#game-canvas{
  position:fixed;top:0;left:0;
  width:100%;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
}

/* ── HUD ── */
#hud{
  position:fixed;top:10px;left:10px;
  z-index:100;display:flex;flex-direction:column;gap:6px;
  pointer-events:none;
}
#hud-name{
  font-size:8px;color:#ffe44d;
  text-shadow:2px 2px #000;
  border:2px solid #ffe44d;
  background:rgba(0,0,0,0.75);
  padding:5px 8px;
}
#hud-hint{
  font-size:6px;color:#aaa;
  background:rgba(0,0,0,0.6);
  padding:3px 7px;border:2px solid #555;
  animation:blink 1.5s step-end infinite;
}
@media(max-width:600px){
  #hud-name{font-size:6px;padding:4px 7px;}
  #hud-hint{font-size:5px;}
}

#portal-counter{
  position:fixed;top:10px;right:10px;
  z-index:100;font-size:7px;color:#fff;
  background:rgba(0,0,0,0.75);
  border:2px solid #7f5af0;
  padding:6px 10px;
  display:flex;gap:7px;align-items:center;
}
.portal-dot{
  width:10px;height:10px;
  background:#333;border:2px solid #555;
  display:inline-block;transition:background .3s;
  cursor:pointer;pointer-events:auto;
}
.portal-dot.visited{background:#7f5af0;border-color:#b388ff;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── MODAL ── */
#modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.88);
  z-index:200;align-items:center;justify-content:center;
  overflow-y:auto;padding:10px 0;
}
#modal-overlay.open{display:flex;}
#modal{
  background:#0d1117;border:4px solid #ffe44d;
  width:92%;max-width:680px;
  max-height:80vh;overflow-y:auto;
  box-shadow:0 0 0 2px #000,6px 6px 0 #000;
  animation:modal-in .15s steps(4) forwards;
  flex-shrink:0;
}
@keyframes modal-in{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

#modal-header{
  background:#ffe44d;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:1;
}
#modal-title{font-size:9px;color:#000;}
#modal-close{
  background:none;border:2px solid #000;
  font-family:'Press Start 2P',monospace;
  font-size:7px;cursor:pointer;
  padding:4px 8px;color:#000;
  transition:background .1s;
}
#modal-close:hover,#modal-close:active{background:#000;color:#ffe44d;}
#modal-body{padding:18px;color:#e0e0e0;}

.section-label{font-size:6px;color:#7f5af0;margin-bottom:10px;letter-spacing:2px;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
@media(max-width:400px){.modal-grid{grid-template-columns:1fr;}}

.card{border:2px solid #333;padding:10px;background:#161b22;}
.card:hover{border-color:#7f5af0;}
.card-title{font-size:6px;color:#ffe44d;margin-bottom:7px;}
.card-body{font-family:'VT323',monospace;font-size:15px;color:#aaa;line-height:1.4;}
.tag{display:inline-block;border:1px solid #555;font-size:5px;padding:2px 5px;margin:2px;color:#7f5af0;}
.link-btn{
  display:inline-block;border:2px solid #ffe44d;
  background:none;font-family:'Press Start 2P',monospace;
  font-size:6px;color:#ffe44d;padding:7px 12px;
  cursor:pointer;text-decoration:none;
  margin:5px 5px 0 0;transition:background .1s;
}
.link-btn:hover,.link-btn:active{background:#ffe44d;color:#000;}
.link-btn.purple{border-color:#7f5af0;color:#7f5af0;}
.link-btn.purple:hover,.link-btn.purple:active{background:#7f5af0;color:#fff;}
.link-btn.green{border-color:#2cb67d;color:#2cb67d;}
.link-btn.green:hover,.link-btn.green:active{background:#2cb67d;color:#fff;}
.stat-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.stat-label{font-size:6px;color:#555;}
.stat-val{font-size:6px;color:#2cb67d;}
.bar-wrap{height:7px;background:#222;margin-bottom:9px;border:1px solid #333;}
.bar-fill{height:100%;background:linear-gradient(90deg,#7f5af0,#2cb67d);}

#intro-msg{
  position:fixed;bottom:180px;left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.82);
  border:2px solid #ffe44d;color:#ffe44d;
  font-size:6px;padding:7px 14px;
  z-index:100;text-align:center;line-height:1.9;
  white-space:nowrap;
  animation:fadeout 4s forwards;animation-delay:3s;
  pointer-events:none;
}
@media(min-width:601px){#intro-msg{bottom:20px;font-size:7px;}}
@keyframes fadeout{to{opacity:0;pointer-events:none;}}

/* ── D-PAD ── */
#dpad-container{
  display:none;
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  z-index:150;
  align-items:center;
  justify-content:center;
}
body.mobile #dpad-container{display:flex;}

#dpad{
  position:relative;
  width:132px;height:132px;
}

.dpad-btn{
  position:absolute;
  background:rgba(20,20,40,0.9);
  border:3px solid #444;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#ffe44d;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transition:background .05s,border-color .05s;
  image-rendering:pixelated;
}
.dpad-btn:active,.dpad-btn.pressed{
  background:rgba(127,90,240,0.5);
  border-color:#7f5af0;
}

/* cross shape: 3 cols × 3 rows, each cell 44px */
#btn-up   {width:44px;height:44px;top:0;left:44px;border-radius:4px 4px 0 0;}
#btn-left {width:44px;height:44px;top:44px;left:0;border-radius:4px 0 0 4px;}
#btn-center{width:44px;height:44px;top:44px;left:44px;background:rgba(10,10,25,0.95);border-color:#333;cursor:default;}
#btn-right{width:44px;height:44px;top:44px;left:88px;border-radius:0 4px 4px 0;}
#btn-down {width:44px;height:44px;top:88px;left:44px;border-radius:0 0 4px 4px;}

/* pixel arrows using borders */
.arrow-up::after   {content:'';display:block;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid #ffe44d;}
.arrow-down::after {content:'';display:block;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid #ffe44d;}
.arrow-left::after {content:'';display:block;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid #ffe44d;}
.arrow-right::after{content:'';display:block;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:12px solid #ffe44d;}

/* center circle decoration */
#btn-center::after{
  content:'';display:block;
  width:12px;height:12px;
  border-radius:50%;
  background:#333;
}

/* dpad glow ring */
#dpad::before{
  content:'';position:absolute;
  inset:-6px;border-radius:4px;
  border:2px solid rgba(127,90,240,0.3);
  pointer-events:none;
}

/* modal scrollbar */
#modal::-webkit-scrollbar{width:6px;}
#modal::-webkit-scrollbar-track{background:#0d1117;}
#modal::-webkit-scrollbar-thumb{background:#333;border:1px solid #0d1117;}
</style>
</head>
<body>

<div id="cursor"></div>
<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="hud-name">▶ TRISCIA.EXE</div>
  <div id="hud-hint" id="ctrl-hint">ARROW KEYS / WASD</div>
</div>

<div id="portal-counter">
  PORTALS:
  <span class="portal-dot" id="pd0"></span>
  <span class="portal-dot" id="pd1"></span>
  <span class="portal-dot" id="pd2"></span>
</div>

<div id="intro-msg">WALK INTO THE PORTALS<br>TO EXPLORE MY PORTFOLIO</div>

<!-- D-PAD -->
<div id="dpad-container">
  <div id="dpad">
    <div class="dpad-btn arrow-up"    id="btn-up"    data-dir="up"></div>
    <div class="dpad-btn arrow-left"  id="btn-left"  data-dir="left"></div>
    <div class="dpad-btn"             id="btn-center"></div>
    <div class="dpad-btn arrow-right" id="btn-right" data-dir="right"></div>
    <div class="dpad-btn arrow-down"  id="btn-down"  data-dir="down"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title">LOADING...</div>
      <button id="modal-close" onclick="closeModal()">✕ CLOSE</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── DEVICE DETECTION ──
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
document.body.classList.add(isMobile ? 'mobile' : 'desktop');
if(!isMobile) {
  document.getElementById('hud-hint').textContent = 'ARROW KEYS / WASD';
} else {
  document.getElementById('hud-hint').textContent = 'USE D-PAD BELOW';
}

// ── CANVAS SETUP ──
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Custom cursor (desktop only)
const cur = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

// ── WORLD ──
const TILE = 32;
const WORLD_W = 80;
const WORLD_H = 40;

let camX = 0, camY = 0;

const player = {
  x: TILE * 3, y: TILE * (WORLD_H / 2),
  vx: 0, vy: 0,
  speed: isMobile ? 2.5 : 3,
  dir: 'down',
  frame: 0,
  animTimer: 0,
  animSpeed: 8
};

const portals = [
  { x: TILE*20, y: TILE*(WORLD_H/2-1), visited:false, id:0 },
  { x: TILE*42, y: TILE*(WORLD_H/2-1), visited:false, id:1 },
  { x: TILE*64, y: TILE*(WORLD_H/2-1), visited:false, id:2 },
];

const portalData = [
  { title:'⚔ ABOUT ME',   content:'about'    },
  { title:'🗂 PROJECTS',   content:'projects' },
  { title:'📡 CONTACT',   content:'contact'  },
];

// ── INPUT ──
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// D-PAD touch handling
const dpadState = { up:false, down:false, left:false, right:false };

function setDpadDir(dir, val) {
  if(dir) dpadState[dir] = val;
  ['up','down','left','right'].forEach(d => {
    const el = document.getElementById('btn-'+d);
    if(el) el.classList.toggle('pressed', dpadState[d]);
  });
}

// Support multi-touch — track which touch id controls which button
const touchMap = {};

function dpadTouchStart(e) {
  e.preventDefault();
  for(const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if(el && el.dataset.dir) {
      touchMap[t.identifier] = el.dataset.dir;
      setDpadDir(el.dataset.dir, true);
    }
  }
}
function dpadTouchMove(e) {
  e.preventDefault();
  for(const t of e.changedTouches) {
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const oldDir = touchMap[t.identifier];
    const newDir = (el && el.dataset.dir) ? el.dataset.dir : null;
    if(oldDir !== newDir) {
      if(oldDir) setDpadDir(oldDir, false);
      if(newDir) setDpadDir(newDir, true);
      touchMap[t.identifier] = newDir;
    }
  }
}
function dpadTouchEnd(e) {
  e.preventDefault();
  for(const t of e.changedTouches) {
    const dir = touchMap[t.identifier];
    if(dir) setDpadDir(dir, false);
    delete touchMap[t.identifier];
  }
}

const dpad = document.getElementById('dpad');
dpad.addEventListener('touchstart',  dpadTouchStart,  {passive:false});
dpad.addEventListener('touchmove',   dpadTouchMove,   {passive:false});
dpad.addEventListener('touchend',    dpadTouchEnd,    {passive:false});
dpad.addEventListener('touchcancel', dpadTouchEnd,    {passive:false});

// ── TILE TYPES ──
const T = { GRASS:0, PATH:1, TREE:2, WATER:3, FLOWER:4, ROCK:5, TALL_GRASS:6, SAND:7 };

// Generate map
const map = [];
for(let r=0;r<WORLD_H;r++){
  map[r]=[];
  const pathRow = Math.floor(WORLD_H/2);
  for(let c=0;c<WORLD_W;c++){
    if(r>=pathRow-1 && r<=pathRow+1){ map[r][c]=T.PATH; continue; }
    const rng=Math.random();
    if(rng<.06 && (r<pathRow-3||r>pathRow+3))      map[r][c]=T.TREE;
    else if(rng<.09&&(r<pathRow-2||r>pathRow+2))   map[r][c]=T.ROCK;
    else if(rng<.13)                                map[r][c]=T.FLOWER;
    else if(rng<.16&&(r<pathRow-2||r>pathRow+2))   map[r][c]=T.TALL_GRASS;
    else if(c>70&&r>pathRow+2&&rng<.3)             map[r][c]=T.WATER;
    else if(c>68&&r>pathRow+2)                      map[r][c]=T.SAND;
    else                                            map[r][c]=T.GRASS;
  }
}

function hashXY(x,y){return((x*2654435761)^(y*2246822519))>>>0;}
function grassCol(c,r){const h=hashXY(c,r);return h%3===0?'#3d6b41':h%3===1?'#4a7c4e':'#527a56';}
function pathCol(c,r){return hashXY(c,r)%2===0?'#c8a96e':'#bf9e63';}

function drawTile(type,px,py,c,r,t){
  const s=TILE;
  switch(type){
    case T.GRASS:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
      if(hashXY(c,r)%5===0){ctx.fillStyle='#6aa870';ctx.fillRect(px+4,py+6,2,2);ctx.fillRect(px+10,py+10,2,2);}
      break;
    case T.PATH:
      ctx.fillStyle=pathCol(c,r);ctx.fillRect(px,py,s,s);
      if(hashXY(c,r)%4===0){ctx.fillStyle='#a87f4e';ctx.fillRect(px+6,py+8,3,2);ctx.fillRect(px+18,py+14,2,2);ctx.fillRect(px+24,py+5,2,3);}
      break;
    case T.TREE:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
      ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(px+8,py+22,16,8);
      ctx.fillStyle='#7a5230';ctx.fillRect(px+12,py+18,8,12);
      ctx.fillStyle='#2d5a27';ctx.fillRect(px+2,py+2,28,20);
      ctx.fillStyle='#3a7832';ctx.fillRect(px+4,py+4,24,16);
      ctx.fillStyle='#4a8f40';ctx.fillRect(px+8,py+6,16,10);
      break;
    case T.WATER:
      const wave=Math.sin(t*.05+c*.5)*2;
      ctx.fillStyle='#1a6b9a';ctx.fillRect(px,py,s,s);
      ctx.fillStyle='#1f7eb5';ctx.fillRect(px,py+4+wave,s,4);ctx.fillRect(px,py+16+wave,s,4);
      ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(px+4,py+6+wave,10,2);ctx.fillRect(px+18,py+18+wave,8,2);
      break;
    case T.FLOWER:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
      const cols=['#ff6b6b','#ffe44d','#ff9ff3','#74b9ff'];
      const fc=cols[hashXY(c,r)%cols.length];
      ctx.fillStyle='#4a8f40';ctx.fillRect(px+12,py+10,2,10);
      ctx.fillStyle=fc;ctx.fillRect(px+8,py+6,10,8);
      ctx.fillStyle='#ffe44d';ctx.fillRect(px+11,py+8,4,4);
      break;
    case T.ROCK:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
      ctx.fillStyle='#888';ctx.fillRect(px+6,py+10,18,14);
      ctx.fillStyle='#aaa';ctx.fillRect(px+8,py+10,14,8);
      ctx.fillStyle='#666';ctx.fillRect(px+6,py+20,18,4);
      break;
    case T.TALL_GRASS:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
      ctx.fillStyle='#2a6b30';
      for(let i=0;i<4;i++){const ox=4+i*7;ctx.fillRect(px+ox,py+4,2,20);ctx.fillRect(px+ox-2,py+8,2,8);ctx.fillRect(px+ox+2,py+6,2,12);}
      break;
    case T.SAND:
      ctx.fillStyle='#d4b483';ctx.fillRect(px,py,s,s);
      if(hashXY(c,r)%3===0){ctx.fillStyle='#c8a870';ctx.fillRect(px+4,py+8,4,2);ctx.fillRect(px+20,py+16,3,2);}
      break;
    default:
      ctx.fillStyle=grassCol(c,r);ctx.fillRect(px,py,s,s);
  }
}

// Sprite image — load with white-bg removal
const spriteImg = new Image();
let spriteCanvas = null;
spriteImg.crossOrigin = 'anonymous';
spriteImg.onload = function() {
  const oc = document.createElement('canvas');
  oc.width = spriteImg.naturalWidth;
  oc.height = spriteImg.naturalHeight;
  const oc2 = oc.getContext('2d');
  oc2.drawImage(spriteImg, 0, 0);
  const id = oc2.getImageData(0, 0, oc.width, oc.height);
  const d = id.data;
  for(let i=0; i<d.length; i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];
    // Remove near-white pixels (background)
    if(r>220 && g>220 && b>220){
      d[i+3] = 0;
    }
  }
  oc2.putImageData(id, 0, 0);
  spriteCanvas = oc;
};

function drawPlayer(x,y,dir,frame){
  const px=Math.floor(x), py=Math.floor(y);
  const isWalking = player.vx!==0||player.vy!==0;
  const f = Math.floor(frame)%4;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(px+4, py+36, 14, 5, 0, 0, Math.PI*2);
  ctx.fill();

  // Bob animation offset
  const bob = isWalking ? Math.sin(tick*0.25)*2 : 0;
  // Leg swing: slight horizontal squish when walking
  const squish = isWalking ? (f<2?1.05:0.95) : 1;

  const size = 64;
  ctx.save();
  // Flip horizontally when going left
  if(dir==='left'){
    ctx.translate(px + size/2 - 4, py - size/2 + 20 + bob);
    ctx.scale(-squish, 1);
    ctx.translate(-(px + size/2 - 4), -(py - size/2 + 20 + bob));
  } else {
    ctx.translate(px + size/2 - 4, py - size/2 + 20 + bob);
    ctx.scale(squish, 1);
    ctx.translate(-(px + size/2 - 4), -(py - size/2 + 20 + bob));
  }

  if(spriteCanvas){
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(spriteCanvas, px - size/2 + 4, py - size/2 + 20 + bob, size, size);
  } else {
    // Fallback dot while image loads
    ctx.fillStyle='#ffe44d';
    ctx.fillRect(px-8, py-8, 16, 16);
  }
  ctx.restore();
}

function drawPortal(px,py,visited,t,id){
  const pulse=Math.sin(t*.08)*4;
  const colors=[['#7f5af0','#b388ff','#4a2db0'],['#ff6b6b','#ff9999','#b03030'],['#2cb67d','#6effc6','#1a7a50']];
  const [c1,c2,c3]=colors[id%3];
  ctx.strokeStyle=visited?'#aaa':c2;ctx.lineWidth=3;
  ctx.strokeRect(px-2,py-2+pulse/2,TILE*2+4,TILE*2+4);
  ctx.fillStyle=visited?'#333':c3;ctx.fillRect(px,py,TILE*2,TILE*2);
  ctx.fillStyle=visited?'#555':c1;ctx.fillRect(px+4,py+4,TILE*2-8,TILE*2-8);
  const angle=t*(visited?.02:.06);
  ctx.save();ctx.translate(px+TILE,py+TILE);ctx.rotate(angle);
  ctx.fillStyle=visited?'#666':c2;
  ctx.fillRect(-8,-8,16,4);ctx.fillRect(-8,4,4,4);ctx.fillRect(4,-8,4,4);ctx.fillRect(-2,-2,4,4);
  ctx.restore();
  ctx.fillStyle=visited?'#888':'#fff';
  ctx.font='12px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
  const symbols=['◉','★','◈'];
  ctx.fillText(symbols[id],px+TILE,py+TILE+2);
  ctx.font='7px "Press Start 2P"';ctx.fillStyle=visited?'#666':c2;ctx.textAlign='center';
  const labels=['ABOUT','PROJECTS','CONTACT'];
  ctx.fillText(labels[id],px+TILE,py-14+pulse/2);
  if(!visited){
    ctx.fillStyle='#ffe44d';
    const bo=Math.sin(t*.1)*3;
    ctx.fillText('▼',px+TILE,py-26+bo);
  }
  ctx.lineWidth=1;
}

// ── GAME LOOP ──
let tick=0,modalOpen=false,lastPortalEntered=-1;

function render(){
  ctx.clearRect(0,0,W,H);
  const startC=Math.max(0,Math.floor(camX/TILE)-1);
  const endC=Math.min(WORLD_W-1,Math.ceil((camX+W)/TILE)+1);
  const startR=Math.max(0,Math.floor(camY/TILE)-1);
  const endR=Math.min(WORLD_H-1,Math.ceil((camY+H)/TILE)+1);
  for(let r=startR;r<=endR;r++)
    for(let c=startC;c<=endC;c++)
      drawTile(map[r][c],Math.floor(c*TILE-camX),Math.floor(r*TILE-camY),c,r,tick);
  for(const p of portals)
    drawPortal(Math.floor(p.x-camX-TILE/2),Math.floor(p.y-camY-TILE/2),p.visited,tick,p.id);
  drawPlayer(Math.floor(player.x-camX),Math.floor(player.y-camY),player.dir,player.frame);
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.8);
  vg.addColorStop(0,'transparent');vg.addColorStop(1,'rgba(0,0,0,0.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,0.04)';
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);
}

function update(){
  if(modalOpen) return;
  player.vx=0;player.vy=0;

  const goLeft  = keys['ArrowLeft']  || keys['a'] || keys['A'] || dpadState.left;
  const goRight = keys['ArrowRight'] || keys['d'] || keys['D'] || dpadState.right;
  const goUp    = keys['ArrowUp']    || keys['w'] || keys['W'] || dpadState.up;
  const goDown  = keys['ArrowDown']  || keys['s'] || keys['S'] || dpadState.down;

  if(goLeft)  { player.vx=-player.speed; player.dir='left'; }
  if(goRight) { player.vx= player.speed; player.dir='right'; }
  if(goUp)    { player.vy=-player.speed; player.dir='up'; }
  if(goDown)  { player.vy= player.speed; player.dir='down'; }

  if(player.vx!==0&&player.vy!==0){ player.vx*=.707; player.vy*=.707; }

  player.x=Math.max(TILE,Math.min(WORLD_W*TILE-TILE*2,player.x+player.vx));
  player.y=Math.max(TILE,Math.min(WORLD_H*TILE-TILE*2,player.y+player.vy));

  if(player.vx!==0||player.vy!==0){
    player.animTimer++;
    if(player.animTimer>=player.animSpeed){ player.frame=(player.frame+1)%4; player.animTimer=0; }
  } else { player.frame=0; }

  const targetCamX=player.x-W/2;
  const targetCamY=player.y-H/2;
  camX+=(targetCamX-camX)*.12;
  camY+=(targetCamY-camY)*.12;
  camX=Math.max(0,Math.min(WORLD_W*TILE-W,camX));
  camY=Math.max(0,Math.min(WORLD_H*TILE-H,camY));

  for(const p of portals){
    const dx=player.x-p.x, dy=player.y-p.y;
    if(Math.abs(dx)<TILE*1.2&&Math.abs(dy)<TILE*1.2){
      if(lastPortalEntered!==p.id){
        lastPortalEntered=p.id;
        p.visited=true;
        updatePortalDots();
        openModal(p.id);
      }
    } else if(Math.abs(dx)>TILE*2.5||Math.abs(dy)>TILE*2.5){
      if(lastPortalEntered===p.id) lastPortalEntered=-1;
    }
  }
}

function updatePortalDots(){
  portals.forEach((p,i)=>{
    const el=document.getElementById('pd'+i);
    if(p.visited) el.classList.add('visited');
  });
}

function openModal(id){
  modalOpen=true;
  document.getElementById('modal-title').textContent=portalData[id].title;
  const body=document.getElementById('modal-body');
  if(id===0)      body.innerHTML=buildAbout();
  else if(id===1) body.innerHTML=buildProjects();
  else            body.innerHTML=buildContact();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal').scrollTop=0;
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  modalOpen=false;
}
